# Self-hosted SyncForge: Redis + the app image (API, WebSockets and the built
# client on one origin), fronted by nginx on port 80.
#
#   cp .env.example .env   # fill in SESSION_SECRET and the GitHub OAuth app
#   docker compose up -d --build
#
# Skip nginx and talk to the app directly with:
#   docker compose up -d --build redis server   # then open http://localhost:3001

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      target: server
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    image: syncforge:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:-http://localhost}"
      REDIS_URL: "redis://redis:6379"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET must be set in .env}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set in .env}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set in .env}"
      GITHUB_CALLBACK_URL: "${GITHUB_CALLBACK_URL:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      REDIS_COMPACTION_THRESHOLD: "${REDIS_COMPACTION_THRESHOLD:-500}"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  redis-data:
