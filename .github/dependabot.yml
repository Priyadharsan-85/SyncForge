version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Platform binaries pinned so Linux CI and Docker builds resolve them.
      # They must move in lockstep with their parent package (rolldown,
      # oxlint, lightningcss, typescript), never on their own.
      - dependency-name: "@rolldown/binding-*"
      - dependency-name: "@oxlint/binding-*"
      - dependency-name: "lightningcss-*"
      - dependency-name: "@typescript/typescript-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
