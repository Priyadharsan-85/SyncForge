# Reverse proxy in front of the SyncForge server. The Node process serves the
# API, Socket.IO and the built client itself, so nginx only terminates the
# public connection, upgrades WebSockets and caps request sizes. Put TLS here
# (or in front of it) for anything beyond localhost.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Local project imports are capped at 13 MB by the server; allow a little
    # headroom for JSON encoding so nginx isn't the one rejecting them.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived collaboration sockets must not be cut by the proxy.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
